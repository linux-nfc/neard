name: "Analysis"
on:
  pull_request:
  push:
  schedule:
    # Run at 1:01 AM, every Tuesday
    - cron: '1 1 * * 2'
  workflow_dispatch:

jobs:
  codeql:
    uses: linux-nfc/neard-workflow/.github/workflows/codeql-analysis.yml@main
    permissions:
      actions: read
      contents: read
      security-events: write
