name: "Builds"
on:
  pull_request:
  push:
  schedule:
    # Run at 1:01 AM, every Tuesday
    - cron: '1 1 * * 2'
  workflow_dispatch:

jobs:
  build-makefile:
    uses: linux-nfc/neard-workflow/.github/workflows/ci.yml@main
    permissions:
      actions: read
      contents: read

  build-meson:
    uses: linux-nfc/neard-workflow/.github/workflows/ci-meson.yml@main
    permissions:
      actions: read
      contents: read
